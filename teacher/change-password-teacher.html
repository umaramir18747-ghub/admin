<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Change Password</title>
   <link rel="icon" type="image/png" href="../logo2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
  
  <link rel="stylesheet" href="../change-password.css">
</head>
<body>

  <!-- Header will be loaded here -->
  <div id="header-placeholder"></div>

  <div class="app-wrapper" id="appWrapper">
    
    <!-- Sidebar will be loaded here -->
    <div id="sidebar-placeholder"></div>

    <!-- Main Content -->
    <main class="main-panel">
      <div class="password-form-container">
        
        <!-- Header -->
        <div class="form-header">
          <i class="fas fa-lock"></i>
          <h1>Password Update Form</h1>
        </div>

        <!-- User Info -->
        <div class="user-info">
          <i class="fas fa-user-circle" style="font-size: 1.4rem; color: #3b82f6;"></i>
          <div>
            <strong>Teacher Registration Number</strong><br>
            <span style="color: #64748b; font-size: 0.9rem;">@teacher name</span>
          </div>
        </div>

        <form id="passwordForm">
          
          <!-- Current Password -->
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-key"></i>
              CURRENT PASSWORD
            </label>
            <div class="input-wrapper">
              <input type="password" id="currentPassword" class="password-input" placeholder="Enter your current password" required>
              <button type="button" class="toggle-password" onclick="togglePassword('currentPassword', this)">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- New Password -->
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-shield-alt"></i>
              NEW PASSWORD
            </label>
            <div class="input-wrapper">
              <input type="password" id="newPassword" class="password-input" placeholder="Enter new password" required oninput="checkPasswordStrength()">
              <button type="button" class="toggle-password" onclick="togglePassword('newPassword', this)">
                <i class="fas fa-eye"></i>
              </button>
            </div>
            <div class="strength-bar" id="strengthBar"></div>
            <div class="strength-text" id="strengthText">Password strength: </div>
          </div>

          <!-- Confirm New Password -->
          <div class="form-group">
            <label class="form-label">
              <i class="fas fa-check-circle"></i>
              CONFIRM NEW PASSWORD
            </label>
            <div class="input-wrapper">
              <input type="password" id="confirmPassword" class="password-input" placeholder="Re-enter new password" required>
              <button type="button" class="toggle-password" onclick="togglePassword('confirmPassword', this)">
                <i class="fas fa-eye"></i>
              </button>
            </div>
          </div>

          <!-- Submit Button -->
          <button type="submit" class="btn-update">
            <i class="fas fa-sync-alt"></i>
            Update Password
          </button>
        </form>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>

  <script>
    // Load Header and Sidebar
    function loadComponents() {
      fetch('header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading header:', err));

      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading sidebar:', err));
    }

    // Password visibility toggle
    function togglePassword(fieldId, btn) {
      const field = document.getElementById(fieldId);
      const icon = btn.querySelector('i');
      
      if (field.type === "password") {
        field.type = "text";
        icon.classList.remove('fa-eye');
        icon.classList.add('fa-eye-slash');
      } else {
        field.type = "password";
        icon.classList.remove('fa-eye-slash');
        icon.classList.add('fa-eye');
      }
    }

    // Simple password strength checker
    function checkPasswordStrength() {
      const password = document.getElementById('newPassword').value;
      const strengthBar = document.getElementById('strengthBar');
      const strengthText = document.getElementById('strengthText');
      
      let strength = 0;
      let color = '#ef4444';
      let text = 'Weak';
      
      if (password.length >= 6) strength++;
      if (password.length >= 8) strength++;
      if (/[A-Z]/.test(password)) strength++;
      if (/[0-9]/.test(password)) strength++;
      if (/[^A-Za-z0-9]/.test(password)) strength++;
      
      if (strength >= 4) {
        color = '#22c55e';
        text = 'Strong';
      } else if (strength >= 3) {
        color = '#eab308';
        text = 'Medium';
      } else {
        color = '#ef4444';
        text = 'Weak';
      }
      
      strengthBar.style.background = color;
      strengthBar.style.width = (strength * 20) + '%';
      strengthText.textContent = `Password strength: ${text}`;
      strengthText.style.color = color;
    }

    // Form submission
    document.getElementById('passwordForm').addEventListener('submit', function(e) {
      e.preventDefault();
      
      const currentPass = document.getElementById('currentPassword').value;
      const newPass = document.getElementById('newPassword').value;
      const confirmPass = document.getElementById('confirmPassword').value;

      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      const teachers = loadFromStorage('messTeachers');
      const teacher = teachers.find(t => t.regNo === session.regNo);

      if (!teacher) {
        alert("Could not find your account. Please log in again.");
        return;
      }

      if (currentPass !== (teacher.password || 'MESS')) {
        alert("Current password is incorrect.");
        return;
      }
      
      if (newPass !== confirmPass) {
        alert("New passwords do not match!");
        return;
      }
      
      if (newPass.length < 6) {
        alert("Password must be at least 6 characters long.");
        return;
      }

      // Update the password in messTeachers — login-credentials.html reads this
      // same storage live, so the change is reflected there automatically.
      teacher.password = newPass;
      saveToStorage('messTeachers', teachers);
      
      // Simulate success
      alert("✅ Password updated successfully!");
      this.reset();
      document.getElementById('strengthBar').style.width = '0%';
      document.getElementById('strengthText').textContent = 'Password strength: Weak';
      document.getElementById('strengthText').style.color = '#ef4444';
    });

    // ===== Session Guard =====
    function requireTeacherSession() {
      const stored = localStorage.getItem('messCurrentUser');
      const session = stored ? JSON.parse(stored) : null;
      if (!session || session.role !== 'teacher') {
        window.location.href = 'login.html';
        return false;
      }
      return true;
    }

    // ===== Storage Helpers =====
    function loadFromStorage(key) {
      const stored = localStorage.getItem(key);
      return stored ? JSON.parse(stored) : [];
    }
    function saveToStorage(key, data) {
      localStorage.setItem(key, JSON.stringify(data));
    }

    function populateUserInfo() {
      const session = JSON.parse(localStorage.getItem('messCurrentUser'));
      const teachers = loadFromStorage('messTeachers');
      const teacher = teachers.find(t => t.regNo === session.regNo);
      if (!teacher) return;

      const userInfoBox = document.querySelector('.user-info');
      if (!userInfoBox) return;
      const strongEl = userInfoBox.querySelector('strong');
      const spanEl = userInfoBox.querySelector('span');
      if (strongEl) strongEl.textContent = teacher.regNo;
      if (spanEl) spanEl.textContent = '@' + teacher.teacherName;
    }

    // Initialize
    window.onload = function() {
      if (!requireTeacherSession()) return;

      loadComponents();
      
      setTimeout(() => {
        if (typeof window.initHeaderAndSidebar === 'function') {
          window.initHeaderAndSidebar();
        }
      }, 400);

      populateUserInfo();
    };
  </script>
</body>
</html>
