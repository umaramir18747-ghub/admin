<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Make a Class</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
  <link rel="stylesheet" href="enroll.css">
</head>
<body>
  <!-- Header will be loaded here -->
  <div id="header-placeholder"></div>

  <div class="app-wrapper" id="appWrapper">
    <!-- Sidebar will be loaded here -->
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
  <div class="header-content">
    <h1>
      <i class="fas fa-chalkboard icon"></i>
      <span id="pageTitleText">Make a Class</span>
    </h1>
    <p id="pageSubtitle">Create a new academic class session or promote an existing class to the next grade.</p>
  </div>
</div>

      <div class="card">
        <div class="card-title">
          <i class="fas fa-info-circle"></i> Class Configuration
          <span id="editLockNotice" style="display:none; font-size:12px; font-weight:600; color:#b45309; background:#fef3c7; padding:4px 10px; border-radius:6px;">
            <i class="fas fa-lock"></i> Promote Mode: Only Grade can be updated
          </span>
        </div>

        <form id="classForm" onsubmit="handleClassSubmit(event)">
          <div class="form-grid-2cols">
            <div class="form-group">
              <label><i class="fas fa-chalkboard"></i> Class Name <span class="req">*</span></label>
              <input type="text" class="form-control" id="className" placeholder="e.g. Morning Class A" oninput="updateClassId()" required>
            </div>
            <div class="form-group">
              <label><i class="fas fa-id-card"></i> Class ID <span class="req">*</span></label>
              <input type="text" class="form-control" id="classId" placeholder="Auto-generated (e.g. CLS-MOR-101)" readonly required>
            </div>
          </div>

          <div class="form-grid-3cols" style="margin-top: 20px;">
            <div class="form-group">
              <label><i class="fas fa-calendar-alt"></i> Academic Session <span class="req">*</span></label>
              <input type="text" class="form-control" id="session" placeholder="2025-2026" maxlength="9" required>
            </div>
            <div class="form-group">
              <label><i class="fas fa-layer-group"></i> Grade Level <span class="req">*</span></label>
              <select class="form-control" id="grade" required>
                <option value="">-- Select Grade --</option>
                <option>Pre-Nursery</option>
                <option>Nursery</option>
                <option>Post-Nursery</option>
                <option>Grade 1</option>
                <option>Grade 2</option>
                <option>Grade 3</option>
                <option>Grade 4</option>
                <option>Grade 5</option>
                <option>Grade 6</option>
                <option>Grade 7</option>
                <option>Grade 8</option>
                <option>Grade 9</option>
                <option>Grade 10</option>
              </select>
            </div>
            <div class="form-group">
              <label><i class="fas fa-tags"></i> Section <span class="req">*</span></label>
              <input type="text" class="form-control" id="section" placeholder="e.g. A, B, or C" maxlength="4" required>
            </div>
          </div>

          <div class="form-grid-full">
            <div class="form-group">
              <label><i class="fas fa-align-left"></i> Description <span style="color:#64748b;font-weight:400;">(Optional)</span></label>
              <textarea class="form-control" id="description" rows="3" placeholder="Additional details, shift timing, teacher in-charge..."></textarea>
            </div>
          </div>

          <div class="btn-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn">
              <i class="fas fa-save"></i> Save Class
            </button>
            <button type="button" class="btn btn-secondary" onclick="resetClassForm()">
              <i class="fas fa-undo"></i> Reset
            </button>
            <a href="class-details.html" class="btn btn-secondary">
              <i class="fas fa-list"></i> View All Classes
            </a>
            <a href="assign-fee.html" class="btn btn-secondary">
              <i class="fas fa-money-bill-wave"></i> Assign Fee
            </a>
          </div>
        </form>
      </div>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    let editingClassId = null;

    // ================= COMPONENT LOADING (HEADER & SIDEBAR) =================
    function loadComponents() {
      // Load Header
      fetch('header.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('header-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading header:', err));

      // Load Sidebar
      fetch('sidebar.html')
        .then(response => response.text())
        .then(data => {
          document.getElementById('sidebar-placeholder').innerHTML = data;
        })
        .catch(err => console.error('Error loading sidebar:', err));
    }

    // ================= STORAGE HELPERS =================
    function loadClasses() {
      try {
        const stored = localStorage.getItem('messClasses');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function saveClasses(classes) {
      localStorage.setItem('messClasses', JSON.stringify(classes));
    }

    function loadStudents() {
      try {
        const stored = localStorage.getItem('messStudents');
        return stored ? JSON.parse(stored) : [];
      } catch (e) {
        return [];
      }
    }

    function saveStudents(students) {
      localStorage.setItem('messStudents', JSON.stringify(students));
    }

    // ================= TOAST HELPERS =================
    // Generic info/warning toast (blue info icon)
    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    // Success toast (green style) — used for class created / promoted
    function showSuccessToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg toast-success';
      t.innerHTML = `<i class="fas fa-check-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2600);
    }

    // Initialize everything after components are loaded
    window.addEventListener('load', function() {
      loadComponents();

      // Give time for HTML to load then initialize JS
      setTimeout(() => {
        if (typeof window.initHeaderAndSidebar === 'function') {
          window.initHeaderAndSidebar();
        }
      }, 400);

      // Existing page initialization
      attachSessionFormatter();

      const params = new URLSearchParams(window.location.search);
      const editId = params.get('edit');
      if (editId) {
        enterPromoteMode(editId);
      }
    });

    function generateClassId(name) {
      if (!name || !name.trim()) return '';
      let base = name.trim().toUpperCase().replace(/[^A-Z0-9\s]/g, '');
      const words = base.split(/\s+/);
      let shortId = '';
      if (words.length === 1) {
        shortId = words[0].substring(0, 3);
      } else {
        const max = Math.min(words.length, 3);
        for (let i = 0; i < max; i++) shortId += words[i].charAt(0);
      }
      const randomNum = Math.floor(Math.random() * 900) + 100;
      return `CLS-${shortId}-${randomNum}`;
    }

    function updateClassId() {
      if (editingClassId) return;
      const name = document.getElementById('className').value.trim();
      const idInput = document.getElementById('classId');
      if (!name) {
        idInput.value = '';
        return;
      }
      idInput.value = generateClassId(name);
    }

    function attachSessionFormatter() {
      const sessionInput = document.getElementById('session');
      if (!sessionInput) return;
      sessionInput.addEventListener('input', function() {
        let digits = this.value.replace(/\D/g, '').substring(0, 8);
        if (digits.length > 4) {
          this.value = digits.substring(0, 4) + '-' + digits.substring(4);
        } else if (digits.length === 4) {
          this.value = digits + '-';
        } else {
          this.value = digits;
        }
      });
    }

    function enterPromoteMode(classId) {
      const classes = loadClasses();
      const cls = classes.find(c => c.id === classId);
      if (!cls) {
        showToast('⚠️ Class not found');
        return;
      }

      editingClassId = classId;
      document.getElementById('pageTitleText').textContent = 'Promote Class';
      document.getElementById('pageSubtitle').textContent = `Promote "${cls.name}" to the next grade. All enrolled students will automatically be promoted.`;
      document.getElementById('submitBtn').innerHTML = '<i class="fas fa-arrow-up"></i> Promote Class';
      document.getElementById('editLockNotice').style.display = 'inline-block';

      const nameInput = document.getElementById('className');
      nameInput.value = cls.name;
      nameInput.readOnly = true;

      const idInput = document.getElementById('classId');
      idInput.value = cls.id;

      const sessionInput = document.getElementById('session');
      sessionInput.value = cls.session || '';
      sessionInput.readOnly = true;

      const sectionInput = document.getElementById('section');
      sectionInput.value = cls.section || '';
      sectionInput.readOnly = true;

      document.getElementById('grade').value = cls.grade || '';
      document.getElementById('description').value = cls.description || '';
    }

    function handleClassSubmit(e) {
      e.preventDefault();

      const className = document.getElementById('className').value.trim();
      const classId = document.getElementById('classId').value.trim();
      const session = document.getElementById('session').value.trim();
      const grade = document.getElementById('grade').value;
      const section = document.getElementById('section').value.trim().toUpperCase();
      const description = document.getElementById('description').value.trim();

      if (!className || !classId || !session || !grade || !section) {
        showToast('⚠️ Please fill all required fields');
        return;
      }

      const classes = loadClasses();

      // EDIT / PROMOTE MODE
      if (editingClassId) {
        const idx = classes.findIndex(c => c.id === editingClassId);
        if (idx === -1) {
          showToast('⚠️ Class record not found');
          return;
        }

        const oldGrade = classes[idx].grade;
        classes[idx].grade = grade;
        classes[idx].description = description;

        saveClasses(classes);

        // Cascade grade promotion to students
        let studentCount = 0;
        if (oldGrade !== grade) {
          const students = loadStudents();
          students.forEach(s => {
            if (s.classId === editingClassId) {
              s.grade = grade;
              studentCount++;
            }
          });
          saveStudents(students);
        }

        if (oldGrade !== grade) {
          showSuccessToast(`Class promoted to ${grade} — ${studentCount} student(s) updated`);
        } else {
          showSuccessToast(`Class details updated successfully`);
        }

        setTimeout(() => {
          window.location.href = 'class-details.html';
        }, 1000);
        return;
      }

      // CREATE MODE
      if (classes.some(c => c.id.toLowerCase() === classId.toLowerCase())) {
        showToast(`⚠️ Class ID "${classId}" already exists`);
        return;
      }

      const newClass = {
        id: classId,
        name: className,
        session: session,
        grade: grade,
        section: section,
        description: description,
        status: 'Active',
        createdDate: new Date().toLocaleString('en-PK', { hour12: true })
      };

      classes.push(newClass);
      saveClasses(classes);
      showSuccessToast(`Class "${className}" is created successfully`);
      resetClassForm();
    }

    function resetClassForm() {
      if (editingClassId) {
        window.location.href = 'class-details.html';
        return;
      }
      document.getElementById('classForm').reset();
      document.getElementById('classId').value = '';
    }
  </script>
</body>
</html>
