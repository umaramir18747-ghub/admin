<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MEI – Enroll Student</title>
  <link rel="icon" type="image/png" href="../logo2.png">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" href="enroll.css">
  <link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <div class="header-content">
          <h1><i class="fas fa-user-graduate icon"></i>Enroll Student</h1>
          <p>Register a new student with class assignment and personal details</p>
        </div>
      </div>

      <form id="studentForm">
        <div class="card">
          <div class="card-title">
            <i class="fas fa-chalkboard"></i> Class Information
          </div>
          <div class="form-grid-5cols">
            <div class="form-group">
              <label><i class="fas fa-chalkboard"></i> Class Name <span class="req">*</span></label>
              <select class="form-control" id="classSelect" required>
                <option value="">-- Select Class --</option>
              </select>
            </div>
            <div class="form-group"><label><i class="fas fa-id-card"></i> Class ID</label><input type="text" class="form-control" id="s_classId" disabled></div>
            <div class="form-group"><label><i class="fas fa-calendar-alt"></i> Session</label><input type="text" class="form-control" id="s_session" disabled></div>
            <div class="form-group"><label><i class="fas fa-layer-group"></i> Grade</label><input type="text" class="form-control" id="s_grade" disabled></div>
            <div class="form-group"><label><i class="fas fa-tags"></i> Section</label><input type="text" class="form-control" id="s_section" disabled></div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            <i class="fas fa-user"></i> Student Personal Information
          </div>
          
          <div class="photo-section">
            <div class="photo-container">
              <div class="photo-heading">Student Photo</div>
              <div class="photo-frame" id="photoFrame"><i class="fas fa-camera"></i><img id="photoPreview" alt="Student Photo"></div>
              <div class="file-name" id="fileName">No file chosen</div>
              <input type="file" id="photoInput" accept="image/*" style="display:none">
            </div>
            <div style="flex:1">
              <div class="form-grid-4cols">
                <!-- Enhanced Registration Number Field -->
                <div class="form-group">
                  <label><i class="fas fa-hashtag"></i> Reg No. <span class="req">*</span></label>
                  <input type="text" class="form-control" id="regNo" required readonly>
                </div>

                <div class="form-group"><label><i class="fas fa-user"></i> Student Name <span class="req">*</span></label><input type="text" class="form-control" id="studentName" required></div>
                <!-- Removed req (asterisk) from Father Name -->
                <div class="form-group"><label><i class="fas fa-user-tie"></i> Father Name</label><input type="text" class="form-control" id="fatherName"></div>
                <div class="form-group"><label><i class="fas fa-phone"></i> Phone</label><input type="text" class="form-control" id="phone" maxlength="12"></div>
                
                <div class="form-group"><label><i class="fas fa-id-card"></i> CNIC</label><input type="text" class="form-control" id="cnic" maxlength="15"></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> Email</label><input type="email" class="form-control" id="email"></div>
                <div class="form-group">
                  <label><i class="fas fa-venus-mars"></i> Gender</label>
                  <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="gender" value="Male"> Male</label>
                    <label class="radio-label"><input type="radio" name="gender" value="Female"> Female</label>
                  </div>
                </div>
                <div class="form-group"><label><i class="fas fa-calendar-day"></i> Date of Birth</label><input type="date" class="form-control" id="dob"></div>

                <div class="form-group"><label><i class="fas fa-globe"></i> Nationality</label><input type="text" class="form-control" id="nationality" value="Pakistani"></div>
                <div class="form-group"><label><i class="fas fa-pray"></i> Religion</label><input type="text" class="form-control" id="religion" value="Islam"></div>
                <div class="form-group"><label><i class="fas fa-sign-in-alt"></i> Joining Date</label><input type="date" class="form-control" id="joiningDate"></div>
                <div class="form-group"><label><i class="fas fa-map-marker-alt"></i> Address</label><input type="text" class="form-control" id="address"></div>
              </div>
            </div>
          </div>
        </div>

        <!-- Guardian Information -->
        <div class="card">
          <div class="card-title">
            <i class="fas fa-users"></i> Guardian Information
          </div>
          <div class="form-grid-5cols">
            <div class="form-group">
              <label><i class="fas fa-user-shield"></i> Guardian Name <span class="req">*</span></label>
              <input type="text" class="form-control" id="guardianName" required>
            </div>
            <div class="form-group">
              <label><i class="fas fa-heart"></i> Relationship</label>
              <input type="text" class="form-control" id="guardianRelationship" placeholder="e.g. Father, Mother, Guardian" value="Father">
            </div>
            <div class="form-group">
              <label><i class="fas fa-phone"></i> Guardian Phone</label>
              <input type="text" class="form-control" id="guardianPhone" maxlength="12">
            </div>
            <div class="form-group">
              <label><i class="fas fa-id-card"></i> Guardian CNIC</label>
              <input type="text" class="form-control" id="guardianCnic" maxlength="15">
            </div>
            <div class="form-group">
              <label><i class="fas fa-briefcase"></i> Occupation</label>
              <input type="text" class="form-control" id="guardianOccupation">
            </div>
          </div>

          <div class="btn-actions">
            <button type="submit" class="btn btn-primary"><i class="fas fa-save"></i> Enroll Student</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-undo"></i> Reset</button>
            <a href="student-details.html" class="btn btn-secondary"><i class="fas fa-eye"></i> View Details</a>
            <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
          </div>
        </div>
      </form>
    </main>
  </div>

  <script src="../components.js"></script>
  <script>
    function loadComponents() {
      fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
      fetch('sidebar.html').then(r => r.text()).then(d => document.getElementById('sidebar-placeholder').innerHTML = d);
    }

    window.onload = function() {
      loadComponents();
      
      setTimeout(() => { 
        if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); 
      }, 400);

      // === Registration Number (auto-generated from class + per-class counter) ===
      initRegNoField();

      // === Class dropdown + storage wiring ===
      populateClassDropdown();
      document.getElementById('classSelect').addEventListener('change', fillClassDetails);
      document.getElementById('studentForm').addEventListener('submit', handleStudentSubmit);
    };

    // ===== Storage Helpers =====
    function loadClasses() {
      const stored = localStorage.getItem('messClasses');
      return stored ? JSON.parse(stored) : [];
    }
    function loadStudents() {
      const stored = localStorage.getItem('messStudents');
      return stored ? JSON.parse(stored) : [];
    }
    function saveStudents(students) {
      localStorage.setItem('messStudents', JSON.stringify(students));
    }

    function showToast(msg) {
      let t = document.createElement('div');
      t.className = 'toast-msg';
      t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
      document.body.appendChild(t);
      setTimeout(() => t.remove(), 2400);
    }

    function populateClassDropdown() {
      const select = document.getElementById('classSelect');
      const classes = loadClasses();
      select.innerHTML = '<option value="">-- Select Class --</option>' +
        classes.map(c => `<option value="${c.id}">${c.name} (${c.grade}${c.section && c.section !== '—' ? ' - ' + c.section : ''})</option>`).join('');
    }

    function fillClassDetails() {
      const select = document.getElementById('classSelect');
      const classes = loadClasses();
      const cls = classes.find(c => c.id === select.value);
      document.getElementById('s_classId').value = cls ? cls.id : '';
      document.getElementById('s_session').value = cls ? cls.session : '';
      document.getElementById('s_grade').value = cls ? cls.grade : '';
      document.getElementById('s_section').value = cls ? cls.section : '';

      // Auto-generate Registration Number from selected class
      updateRegNoFromClass(cls);
    }

    // ===== Build the base prefix: S.MEI-XXXX-SECTION =====
    function buildRegNoBase(cls) {
      if (!cls) return 'S.MEI-';

      // Extract the 4 digits AFTER the hyphen in session (e.g. 2025-2026 -> 2026)
      let sessionPart = '';
      if (cls.session && cls.session.includes('-')) {
        sessionPart = cls.session.split('-')[1] || '';
        sessionPart = sessionPart.replace(/\D/g, '').substring(0, 4);
      }

      // Section (fallback to N/A if empty or dash)
      let sectionPart = (cls.section && cls.section !== '—' && cls.section !== 'N/A')
        ? cls.section.replace(/\s+/g, '').toUpperCase()
        : 'N/A';

      return `S.MEI-${sessionPart}-${sectionPart}`;
    }

    // ===== Get next sequence number for a class (01, 02, 03...) =====
    function getNextSeqForClass(cls) {
      if (!cls) return 1;

      const students = loadStudents();
      const base = buildRegNoBase(cls);

      // Count existing students whose regNo starts with this exact base + '-'
      const existing = students.filter(s =>
        s.classId === cls.id &&
        s.regNo &&
        s.regNo.startsWith(base + '-')
      );

      return existing.length + 1;
    }

    // ===== Registration Number generator: S.MEI-XXXX-SECTION-NN =====
    function updateRegNoFromClass(cls) {
      const regNoInput = document.getElementById('regNo');

      if (!cls) {
        regNoInput.value = 'S.MEI-';
        return;
      }

      const base = buildRegNoBase(cls);
      const nextSeq = getNextSeqForClass(cls);
      const seqPart = String(nextSeq).padStart(2, '0');

      regNoInput.value = `${base}-${seqPart}`;
    }

    function handleStudentSubmit(e) {
      e.preventDefault();

      const classId = document.getElementById('classSelect').value;
      const classes = loadClasses();
      const cls = classes.find(c => c.id === classId);

      if (!cls) {
        showToast('⚠️ Please select a valid class');
        return;
      }

      // Always regenerate right before saving (in case something changed)
      updateRegNoFromClass(cls);

      const regNo = document.getElementById('regNo').value.trim();
      const studentName = document.getElementById('studentName').value.trim();
      const fatherName = document.getElementById('fatherName').value.trim();
      const guardianName = document.getElementById('guardianName').value.trim();
      const guardianPhone = document.getElementById('guardianPhone').value.trim();

      // Required fields: regNo, studentName, guardianName
      if (!regNo || !studentName || !guardianName) {
        showToast('⚠️ Please fill all required fields (Reg No, Student Name, Guardian Name)');
        return;
      }

      const students = loadStudents();
      if (students.some(s => s.regNo.toLowerCase() === regNo.toLowerCase())) {
        showToast(`⚠️ Reg No. "${regNo}" already exists`);
        return;
      }

      const genderInput = document.querySelector('input[name="gender"]:checked');

      const newStudent = {
        regNo: regNo,
        studentName: studentName,
        fatherName: fatherName,
        phoneNumber: document.getElementById('phone').value.trim(),
        cnic: document.getElementById('cnic').value.trim(),
        email: document.getElementById('email').value.trim(),
        gender: genderInput ? genderInput.value : '',
        dob: document.getElementById('dob').value,
        nationality: document.getElementById('nationality').value.trim(),
        religion: document.getElementById('religion').value.trim(),
        joiningDate: document.getElementById('joiningDate').value,
        address: document.getElementById('address').value.trim(),
        guardianName: guardianName,
        guardianRelationship: document.getElementById('guardianRelationship').value.trim(),
        guardianPhone: guardianPhone,
        guardianCnic: document.getElementById('guardianCnic').value.trim(),
        guardianOccupation: document.getElementById('guardianOccupation').value.trim(),
        photoUrl: document.getElementById('photoPreview').src && document.getElementById('photoPreview').src.startsWith('data:') ? document.getElementById('photoPreview').src : null,
        classId: cls.id,
        className: cls.name,
        session: cls.session,
        grade: cls.grade,
        section: cls.section,
        status: 'Active',
        password: 'MESS'
      };

      students.push(newStudent);
      saveStudents(students);
      showToast(`✅ Student "${studentName}" enrolled successfully`);
      resetForm();
    }

    // Registration Number is now fully auto-generated (readonly).
    // It updates whenever the class selection changes.
    function initRegNoField() {
      const regNoInput = document.getElementById('regNo');
      regNoInput.value = 'S.MEI-';
      // No manual input handling needed — the field is readonly.
    }

    const photoInput=document.getElementById('photoInput');
    const photoFrame=document.getElementById('photoFrame');
    const photoPreview=document.getElementById('photoPreview');
    const fileName=document.getElementById('fileName');

    photoFrame.addEventListener('click',()=>photoInput.click());
    photoInput.addEventListener('change',e=>{
      const file=e.target.files[0];
      if(file){
        fileName.textContent=file.name;
        const reader=new FileReader();
        reader.onload=ev=>{photoPreview.src=ev.target.result;photoFrame.classList.add('has-image')};
        reader.readAsDataURL(file);
      }
    });

    function resetForm(){
      document.getElementById('studentForm').reset();
      
      // Reset Reg No (empty class selected)
      document.getElementById('regNo').value = 'S.MEI-';
      
      photoPreview.src='';
      photoFrame.classList.remove('has-image');
      fileName.textContent='No file chosen';
    }
  </script>
</body>
</html>
