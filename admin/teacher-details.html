<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
<title>MEI – Teacher Details</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="../logo2.png">
<link rel="stylesheet" href="view-details.css">
<link rel="stylesheet" href="../components.css">
<link rel="stylesheet" href="../responsive-components.css">
</head>
<body>
<div id="header-placeholder"></div>
<div class="app-wrapper" id="appWrapper">
  <div id="sidebar-placeholder"></div>

  <div class="app-container">
    <main class="main-panel">
      <div class="page-header">
        <h1><i class="fas fa-chalkboard-teacher"></i> Teacher Records</h1>
        <p>Manage teacher profiles, track assignments, and view detailed information.</p>
      </div>
      <div class="data-card">
        <div class="card-header">
          <h2><i class="fas fa-table-list"></i> Enrolled Teachers <span class="badge-count" id="teacherCountBadge">0</span></h2>
          <div class="search-wrapper">
            <i class="fas fa-search search-icon"></i>
            <input type="text" id="teacherSearchInput" placeholder="Search by name or registration number..." class="search-input">
            <button class="search-clear-btn" id="clearSearchBtn" style="display: none;"><i class="fas fa-times-circle"></i></button>
          </div>
        </div>
        
        <div class="table-wrapper">
          <table>
            <thead>
              <tr>
                <th>Photo</th>
                <th>Reg No.</th>
                <th>Teacher Name</th>
                <th>Father Name</th>
                <th>Designation</th>
                <th>Phone</th>
                <th>Status</th>
                <th style="text-align: right;">Actions</th>
              </tr>
            </thead>
            <tbody id="teacherTableBody"></tbody>
          </table>
        </div>
        
        <!-- No results message -->
        <div id="noResultsMessage" style="display: none; text-align: center; padding: 40px 20px; color: #64748b;">
          <i class="fas fa-search" style="font-size: 32px; display: block; margin-bottom: 12px; color: #94a3b8;"></i>
          <p style="font-size: 16px; font-weight: 500; color: #1e293b;">No teachers found</p>
          <p style="font-size: 14px;">Try adjusting your search terms</p>
        </div>
      </div>
    </main>
  </div>
</div>

<div id="teacherSlidePanel" class="student-overlay">
  <div class="student-detail-panel">
    <div class="panel-header">
      <h2><i class="fas fa-id-card"></i> Teacher Profile</h2>
      <button class="close-panel-btn" id="closeSlideBtn"><i class="fas fa-times"></i></button>
    </div>
    <div id="dynamicPanelContent"></div>
  </div>
</div>

<script src="../components.js"></script>
<script>
  function loadComponents() {
    fetch('header.html').then(r => r.text()).then(data => document.getElementById('header-placeholder').innerHTML = data);
    fetch('sidebar.html').then(r => r.text()).then(data => document.getElementById('sidebar-placeholder').innerHTML = data);
  }

  window.onload = function() {
    loadComponents();
    setTimeout(() => {
      if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar();
    }, 400);
  };

  // ===== Storage Helpers =====
  function loadTeachersFromStorage() {
    const stored = localStorage.getItem('messTeachers');
    return stored ? JSON.parse(stored) : [];
  }
  function saveTeachersToStorage(data) {
    localStorage.setItem('messTeachers', JSON.stringify(data));
  }

  let teachers = loadTeachersFromStorage();
  let filteredTeachers = [...teachers];

  function showToast(msg) {
    let t = document.createElement('div');
    t.className = 'toast-msg';
    t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2200);
  }

  function updateTeacherCount() {
    document.getElementById('teacherCountBadge').innerText = filteredTeachers.length;
  }

  // ===== SEARCH FUNCTIONALITY =====
  function filterTeachers(searchTerm) {
    const term = searchTerm.toLowerCase().trim();
    const clearBtn = document.getElementById('clearSearchBtn');
    const noResults = document.getElementById('noResultsMessage');
    
    if (!term) {
      filteredTeachers = [...teachers];
      clearBtn.style.display = 'none';
    } else {
      filteredTeachers = teachers.filter(teacher => {
        const nameMatch = teacher.teacherName.toLowerCase().includes(term);
        const regMatch = teacher.regNo.toLowerCase().includes(term);
        const fatherMatch = teacher.fatherName && teacher.fatherName.toLowerCase().includes(term);
        const phoneMatch = teacher.phoneNumber && teacher.phoneNumber.includes(term);
        
        return nameMatch || regMatch || fatherMatch || phoneMatch;
      });
      clearBtn.style.display = 'block';
    }
    
    renderTeacherTable();
    updateTeacherCount();
  }

  // Setup search event listeners
  document.addEventListener('DOMContentLoaded', function() {
    const searchInput = document.getElementById('teacherSearchInput');
    const clearBtn = document.getElementById('clearSearchBtn');
    
    if (searchInput) {
      searchInput.addEventListener('input', function() {
        filterTeachers(this.value);
      });
      
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Escape') {
          this.value = '';
          filterTeachers('');
          this.blur();
        }
      });
    }
    
    if (clearBtn) {
      clearBtn.addEventListener('click', function() {
        if (searchInput) {
          searchInput.value = '';
          filterTeachers('');
          searchInput.focus();
        }
      });
    }
  });

  function renderTeacherTable() {
    const tbody = document.getElementById('teacherTableBody');
    const noResults = document.getElementById('noResultsMessage');
    if(!tbody) return;
    
    if (filteredTeachers.length === 0) {
      tbody.innerHTML = '';
      noResults.style.display = 'block';
      document.getElementById('teacherCountBadge').innerText = '0';
      return;
    }
    
    noResults.style.display = 'none';
    
    tbody.innerHTML = filteredTeachers.map(t => {
      const photoHtml = t.photoUrl 
        ? `<img src="${t.photoUrl}" class="photo-thumb" alt="${t.teacherName}">` 
        : `<div class="photo-placeholder"><i class="fas fa-user"></i></div>`;
      
      return `
        <tr>
          <td>${photoHtml}</td>
          <td><strong>${escapeHtml(t.regNo)}</strong></td>
          <td>${escapeHtml(t.teacherName)}</td>
          <td>${escapeHtml(t.fatherName)}</td>
          <td>${escapeHtml(t.designation || '—')}</td>
          <td>${escapeHtml(t.phoneNumber)}</td>
          <td>
            <select class="status-select ${t.status === 'Active' ? 'active-select' : 'inactive-select'}" 
                    data-regno="${t.regNo}" onchange="updateStatus('${t.regNo}', this.value)">
              <option value="Active" ${t.status === 'Active' ? 'selected' : ''}>Active</option>
              <option value="Inactive" ${t.status === 'Inactive' ? 'selected' : ''}>Inactive</option>
            </select>
          </td>
          <td style="text-align:right">
            <div class="action-icons">
              <i class="fas fa-eye view-icon" data-regno="${t.regNo}"></i>
              <i class="fas fa-edit edit-icon" data-regno="${t.regNo}"></i>
              <i class="fas fa-trash-alt delete-icon" data-regno="${t.regNo}"></i>
            </div>
          </td>
        </tr>
      `;
    }).join('');

    // Attach event listeners
    document.querySelectorAll('.view-icon').forEach(i => i.addEventListener('click', () => openPanel(i.dataset.regno)));
    document.querySelectorAll('.edit-icon').forEach(i => i.addEventListener('click', () => editTeacherByRegNo(i.dataset.regno)));
    document.querySelectorAll('.delete-icon').forEach(i => i.addEventListener('click', () => { 
      if(confirm(`Delete ${i.dataset.regno}?`)) { 
        teachers = teachers.filter(t => t.regNo !== i.dataset.regno); 
        saveTeachersToStorage(teachers);
        const searchInput = document.getElementById('teacherSearchInput');
        filterTeachers(searchInput ? searchInput.value : '');
        showToast(`🗑️ Deleted`); 
      } 
    }));
  }

  function escapeHtml(str) { 
    if (!str) return ''; 
    return str.replace(/[&<>]/g, m => m === '&' ? '&amp;' : m === '<' ? '&lt;' : '&gt;'); 
  }

  window.updateStatus = (regNo, newStatus) => { 
    let t = teachers.find(t => t.regNo === regNo); 
    if(t) { 
      t.status = newStatus; 
      saveTeachersToStorage(teachers);
      // Update in filtered list too
      let ft = filteredTeachers.find(t => t.regNo === regNo);
      if(ft) ft.status = newStatus;
      renderTeacherTable(); 
      showToast(`✅ Status: ${newStatus}`); 
    } 
  };

  function editTeacherByRegNo(regNo) {
    const t = teachers.find(t => t.regNo === regNo);
    if (!t) return;
    let newName = prompt("Edit Teacher Name:", t.teacherName);
    if (newName && newName.trim()) {
      t.teacherName = newName.trim();
      let ft = filteredTeachers.find(f => f.regNo === regNo);
      if(ft) ft.teacherName = newName.trim();
    }
    let newFather = prompt("Edit Father/Spouse Name:", t.fatherName);
    if (newFather && newFather.trim()) {
      t.fatherName = newFather.trim();
      let ft = filteredTeachers.find(f => f.regNo === regNo);
      if(ft) ft.fatherName = newFather.trim();
    }
    let newPhone = prompt("Edit Phone:", t.phoneNumber);
    if (newPhone && newPhone.trim()) {
      t.phoneNumber = newPhone.trim();
      let ft = filteredTeachers.find(f => f.regNo === regNo);
      if(ft) ft.phoneNumber = newPhone.trim();
    }
    let newDesignation = prompt("Edit Designation:", t.designation);
    if (newDesignation && newDesignation.trim()) {
      t.designation = newDesignation.trim();
      let ft = filteredTeachers.find(f => f.regNo === regNo);
      if(ft) ft.designation = newDesignation.trim();
    }
    saveTeachersToStorage(teachers);
    const searchInput = document.getElementById('teacherSearchInput');
    filterTeachers(searchInput ? searchInput.value : '');
    showToast(`✏️ Teacher ${t.regNo} updated`);
  }

  function openPanel(regNo) {
    let t = teachers.find(t => t.regNo === regNo);
    if(!t) return;
    let photoHtml = t.photoUrl ? `<img src="${t.photoUrl}">` : `<i class="fas fa-user"></i>`;
    
    document.getElementById('dynamicPanelContent').innerHTML = `
      <div class="photo-frame-section">
        <div class="photo-frame">${photoHtml}</div>
        <div class="reg-number-bold"> ${t.regNo}</div>
      </div>
      <div class="info-group"><h4><i class="fas fa-address-card"></i> Personal Information</h4>
        <div class="info-row"><div class="info-label">Teacher Name</div><div class="info-value">${escapeHtml(t.teacherName)}</div></div>
        <div class="info-row"><div class="info-label">S/O, D/O, W/O</div><div class="info-value">${escapeHtml(t.fatherName)}</div></div>
        <div class="info-row"><div class="info-label">Phone</div><div class="info-value">${escapeHtml(t.phoneNumber)}</div></div>
        <div class="info-row"><div class="info-label">CNIC</div><div class="info-value">${escapeHtml(t.cnic || '—')}</div></div>
        <div class="info-row"><div class="info-label">Address</div><div class="info-value">${escapeHtml(t.address)}</div></div>
        <div class="info-row"><div class="info-label">Email</div><div class="info-value">${escapeHtml(t.email || '—')}</div></div>
        <div class="info-row"><div class="info-label">Gender</div><div class="info-value">${escapeHtml(t.gender)}</div></div>
        <div class="info-row"><div class="info-label">DOB</div><div class="info-value">${new Date(t.dob).toLocaleDateString()}</div></div>
        <div class="info-row"><div class="info-label">Nationality</div><div class="info-value">${escapeHtml(t.nationality)}</div></div>
        <div class="info-row"><div class="info-label">Religion</div><div class="info-value">${escapeHtml(t.religion)}</div></div>
      </div>
      <div class="info-group"><h4><i class="fas fa-briefcase"></i> Professional Information</h4>
        <div class="info-row"><div class="info-label">Qualification</div><div class="info-value">${escapeHtml(t.qualification || '—')}</div></div>
        <div class="info-row"><div class="info-label">Subject</div><div class="info-value">${escapeHtml(t.subjectsCanTeach || '—')}</div></div>
        <div class="info-row"><div class="info-label">Previous School</div><div class="info-value">${escapeHtml(t.previousSchool || '—')}</div></div>
        <div class="info-row"><div class="info-label">Experience</div><div class="info-value">${escapeHtml(t.experience || '—')}</div></div>
        <div class="info-row"><div class="info-label">Designation</div><div class="info-value">${escapeHtml(t.designation || '—')}</div></div>
      </div>
      <div class="info-group"><h4><i class="fas fa-clock"></i> Employment Information</h4>
        <div class="info-row"><div class="info-label">Joining Date</div><div class="info-value">${new Date(t.joiningDate).toLocaleDateString()}</div></div>
        <div class="info-row"><div class="info-label">Status</div><div class="info-value"><span class="status-badge ${t.status === 'Active' ? 'status-active' : 'status-inactive'}">${t.status}</span></div></div>
      </div>
    `;
    document.getElementById('teacherSlidePanel').classList.add('active');
  }

  function closePanel() { 
    document.getElementById('teacherSlidePanel').classList.remove('active'); 
  }

  document.getElementById('closeSlideBtn').addEventListener('click', closePanel);
  document.getElementById('teacherSlidePanel').addEventListener('click', (e) => { 
    if(e.target === document.getElementById('teacherSlidePanel')) closePanel(); 
  });
  document.addEventListener('keydown', (e) => { 
    if(e.key === 'Escape' && document.getElementById('teacherSlidePanel').classList.contains('active')) closePanel(); 
  });

  // Initial render
  filteredTeachers = [...teachers];
  renderTeacherTable();
  updateTeacherCount();
</script>
</body>
</html>
