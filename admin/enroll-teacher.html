<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MEI – Enroll Teacher</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<link rel="icon" type="image/png" href="../logo2.png">
<link rel="stylesheet" href="enroll.css">
<link rel="stylesheet" href="../components.css">
  <link rel="stylesheet" href="../responsive-components.css">
<style>
  /* ===== Subject Tag Input (matches standard form-control look) ===== */
  .subject-tag-wrap {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    align-items: center;
    width: 100%;
    min-height: 42px;
    padding: 6px 10px;
    border: 1px solid #cbd5e1;
    background: #ffffff;
    border-radius: 0px;
    transition: border-color 0.2s, box-shadow 0.2s;
    cursor: text;
    box-sizing: border-box;
    font-size: 13px;
    color: #0f172a;
  }
  .subject-tag-wrap:focus-within {
    border-color: #2563eb;
    box-shadow: 0 0 0 3px rgba(37, 99, 235, 0.15);
  }
  .subject-tag {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #2563eb;
    color: #fff;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 8px 4px 10px;
    border-radius: 0px;
    line-height: 1;
    white-space: nowrap;
  }
  .subject-tag .tag-remove {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 16px;
    height: 16px;
    border-radius: 50%;
    background: rgba(255,255,255,0.25);
    color: #fff;
    font-size: 10px;
    cursor: pointer;
    border: 0;
    padding: 0;
    transition: background 0.15s;
  }
  .subject-tag .tag-remove:hover {
    background: rgba(255,255,255,0.45);
  }
  .subject-tag-input {
    flex: 1;
    min-width: 120px;
    border: 0;
    outline: 0;
    padding: 4px 2px;
    font-size: 13px;
    background: transparent;
    color: #0f172a;
  }
  .subject-tag-input::placeholder {
    color: #94a3b8;
  }

  /* ===== Experience input with "Years +" suffix ===== */
  .exp-input-wrap {
    position: relative;
    display: flex;
    align-items: center;
  }
  .exp-input-wrap input {
    width: 100%;
    padding-right: 70px;
  }
  .exp-suffix {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    font-size: 12px;
    font-weight: 600;
    color: #64748b;
    pointer-events: none;
    display: none;
    user-select: none;
  }
  .exp-suffix.show {
    display: inline-block;
  }

  /* ===== Lock notice (edit mode) ===== */
  .lock-notice {
    margin-left:auto;
    font-size:12px;
    font-weight:600;
    color:#b45309;
    background:#fef3c7;
    padding:4px 10px;
    border-radius:6px;
    display:none;
  }
</style>
</head>
<body>
  <div id="header-placeholder"></div>
  <div class="app-wrapper" id="appWrapper">
    <div id="sidebar-placeholder"></div>

    <main class="main-panel">
      <div class="page-header">
        <div class="header-content">
          <h1><i class="fas fa-chalkboard-teacher icon"></i><span id="pageTitleText">Enroll Teacher</span></h1>
          <p id="pageSubtitle">Register a new teacher with personal and professional details</p>
        </div>
      </div>

      <form id="teacherForm">
        <div class="card">
          <div class="card-title">
            <i class="fas fa-user"></i> Teacher Personal Information
            <span id="editLockNotice" class="lock-notice">
              <i class="fas fa-lock"></i> Reg No. cannot be changed
            </span>
          </div>
          <div class="photo-section">
            <div class="photo-container">
              <div class="photo-heading">Teacher Photo</div>
              <div class="photo-frame" id="photoFrame"><i class="fas fa-camera"></i><img id="photoPreview" alt="Teacher Photo"></div>
              <div class="file-name" id="fileName">No file chosen</div>
              <input type="file" id="photoInput" accept="image/*" style="display:none">
            </div>
            
            <div style="flex:1">
              <div class="form-grid-4cols">
                <!-- Enhanced Registration Number Field -->
                <div class="form-group">
                  <label><i class="fas fa-hashtag"></i> Reg No. <span class="req">*</span></label>
                  <input type="text" class="form-control" id="regNo" required readonly>
                </div>

                <div class="form-group"><label><i class="fas fa-user-graduate"></i> Teacher Name <span class="req">*</span></label><input type="text" class="form-control" id="teacherName" required></div>
                <!-- Removed required indicator from Father Name -->
                <div class="form-group"><label><i class="fas fa-user-tie"></i> S/O, D/O, W/O</label><input type="text" class="form-control" id="fatherName"></div>
                <div class="form-group"><label><i class="fas fa-phone"></i> Phone</label><input type="text" class="form-control" id="phone" maxlength="12" placeholder="XXXX-XXXXXXX"></div>
                
                <div class="form-group"><label><i class="fas fa-id-card"></i> CNIC</label><input type="text" class="form-control" id="cnic" maxlength="15" placeholder="XXXXX-XXXXXXX-X"></div>
                <div class="form-group"><label><i class="fas fa-envelope"></i> Email</label><input type="email" class="form-control" id="email"></div>
                <div class="form-group">
                  <label><i class="fas fa-venus-mars"></i> Gender</label>
                  <div class="radio-group">
                    <label class="radio-label"><input type="radio" name="gender" value="Male"> Male</label>
                    <label class="radio-label"><input type="radio" name="gender" value="Female"> Female</label>
                  </div>
                </div>
                <div class="form-group"><label><i class="fas fa-calendar-day"></i> Date of Birth</label><input type="date" class="form-control" id="dob"></div>

                <div class="form-group"><label><i class="fas fa-globe"></i> Nationality</label><input type="text" class="form-control" id="nationality" value="Pakistani"></div>
                <div class="form-group"><label><i class="fas fa-pray"></i> Religion</label><input type="text" class="form-control" id="religion" value="Islam"></div>
                <div class="form-group"><label><i class="fas fa-sign-in-alt"></i> Joining Date</label><input type="date" class="form-control" id="joiningDate"></div>
                <div class="form-group"><label><i class="fas fa-map-marker-alt"></i> Address</label><input type="text" class="form-control" id="address"></div>
              </div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-title">
            <i class="fas fa-briefcase"></i> Teacher Professional Information
          </div>
          <div class="form-grid-5cols">
            <div class="form-group"><label><i class="fas fa-graduation-cap"></i> Qualification</label><input type="text" class="form-control" id="qualification"></div>

            <!-- ===== Subject Tag Input ===== -->
            <div class="form-group">
              <label><i class="fas fa-book-reader"></i> Subject(s)</label>
              <div class="subject-tag-wrap" id="subjectTagWrap">
                <input
                  type="text"
                  class="subject-tag-input"
                  id="subjectInput"
                  placeholder="Type subject & press Enter"
                  autocomplete="off"
                >
              </div>
              <input type="hidden" id="subjectsHidden" name="subjects">
            </div>

            <div class="form-group"><label><i class="fas fa-school"></i> Previous School</label><input type="text" class="form-control" id="prevSchool"></div>

            <!-- ===== Experience with "Years +" suffix ===== -->
            <div class="form-group">
              <label><i class="fas fa-briefcase"></i> Experience</label>
              <div class="exp-input-wrap">
                <input type="text" class="form-control" id="experience" inputmode="numeric" maxlength="2" placeholder="e.g. 5">
                <span class="exp-suffix" id="expSuffix">Years +</span>
              </div>
            </div>

            <!-- ===== Designation (now text input, no dropdown) ===== -->
            <div class="form-group">
              <label><i class="fas fa-user-tie"></i> Designation</label>
              <input type="text" class="form-control" id="designation">
            </div>
          </div>

          <div class="btn-actions">
            <button type="submit" class="btn btn-primary" id="submitBtn"><i class="fas fa-save"></i> Enroll Teacher</button>
            <button type="button" class="btn btn-secondary" onclick="resetForm()"><i class="fas fa-undo"></i> Reset</button>
            <a href="teacher-details.html" class="btn btn-secondary"><i class="fas fa-eye"></i> View Details</a>
            <a href="index.html" class="btn btn-secondary"><i class="fas fa-arrow-left"></i> Back to Dashboard</a>
          </div>
        </div>
      </form>
    </main>
  </div>

<script src="../components.js"></script>
<script>
  let editingRegNo = null;   // null = create mode, otherwise edit mode

  function loadComponents() {
    fetch('header.html').then(r => r.text()).then(d => document.getElementById('header-placeholder').innerHTML = d);
    fetch('sidebar.html').then(r => r.text()).then(d => document.getElementById('sidebar-placeholder').innerHTML = d);
  }

  // ===== Get today's date in YYYY-MM-DD format =====
  function getTodayDate() {
    const now = new Date();
    const yyyy = now.getFullYear();
    const mm = String(now.getMonth() + 1).padStart(2, '0');
    const dd = String(now.getDate()).padStart(2, '0');
    return `${yyyy}-${mm}-${dd}`;
  }

  // ===== Set Joining Date to today (only in create mode, only if empty) =====
  function setDefaultJoiningDate() {
    if (editingRegNo) return;   // don't override in edit mode
    const jd = document.getElementById('joiningDate');
    if (!jd.value) {
      jd.value = getTodayDate();
    }
  }

  // ===== Experience field: numeric-only + "Years +" suffix =====
  function initExperienceField() {
    const expInput = document.getElementById('experience');
    const expSuffix = document.getElementById('expSuffix');

    // Show suffix if there's a value at load (e.g. edit mode)
    const syncSuffix = () => {
      if (expInput.value && expInput.value.trim() !== '') {
        expSuffix.classList.add('show');
      } else {
        expSuffix.classList.remove('show');
      }
    };

    // Numeric only, 0–99
    expInput.addEventListener('input', () => {
      // Strip non-digits
      let v = expInput.value.replace(/\D/g, '');
      // Max 2 digits
      if (v.length > 2) v = v.slice(0, 2);
      // Clamp to 99 max
      if (v !== '' && parseInt(v, 10) > 99) v = '99';
      expInput.value = v;
      syncSuffix();
    });

    // Block non-numeric keys at keydown for nicer UX
    expInput.addEventListener('keydown', (e) => {
      const allowed = ['Backspace','Delete','Tab','ArrowLeft','ArrowRight','Home','End','Enter'];
      if (allowed.includes(e.key)) return;
      if (e.ctrlKey || e.metaKey) return;   // allow Ctrl+A/C/V etc.
      if (!/^\d$/.test(e.key)) {
        e.preventDefault();
      }
    });

    // Initial sync
    syncSuffix();
  }

  window.onload = function() {
    loadComponents();
    
    setTimeout(() => { 
      if (typeof window.initHeaderAndSidebar === 'function') window.initHeaderAndSidebar(); 
    }, 400);

    // Initialize Registration Number system
    initRegNoField();

    // Initialize Subject Tag Input
    initSubjectTagInput();

    // Initialize Experience field
    initExperienceField();

    // Default Joining Date = today
    setDefaultJoiningDate();

    document.getElementById('teacherForm').addEventListener('submit', handleTeacherSubmit);

    // Check for edit mode via URL param
    const params = new URLSearchParams(window.location.search);
    const editRegNo = params.get('edit');
    if (editRegNo) {
      enterEditMode(editRegNo);
    }
  };

  // ===== Storage Helpers =====
  function loadTeachers() {
    const stored = localStorage.getItem('messTeachers');
    return stored ? JSON.parse(stored) : [];
  }
  function saveTeachers(teachers) {
    localStorage.setItem('messTeachers', JSON.stringify(teachers));
  }

  function showToast(msg) {
    let t = document.createElement('div');
    t.className = 'toast-msg';
    t.innerHTML = `<i class="fas fa-info-circle"></i> ${msg}`;
    document.body.appendChild(t);
    setTimeout(() => t.remove(), 2400);
  }

  // ===== Reg No Generator: T.MEI-<lowername>-NNN =====
  function buildNameSlug(name) {
    if (!name || !name.trim()) return '';
    // lowercase, remove anything that is not a-z or 0-9
    return name.trim().toLowerCase().replace(/[^a-z0-9]/g, '');
  }

  function getNextTeacherSeq() {
    const teachers = loadTeachers();
    return teachers.length + 1;
  }

  function updateRegNo() {
    if (editingRegNo) return;   // lock in edit mode

    const regNoInput = document.getElementById('regNo');
    const nameInput = document.getElementById('teacherName');
    const slug = buildNameSlug(nameInput.value);

    if (!slug) {
      regNoInput.value = 'T.MEI-';
      return;
    }

    const seq = String(getNextTeacherSeq()).padStart(3, '0');
    regNoInput.value = `T.MEI-${slug}-${seq}`;
  }

  function initRegNoField() {
    const regNoInput = document.getElementById('regNo');
    const nameInput = document.getElementById('teacherName');

    // Initial state
    regNoInput.value = 'T.MEI-';

    // Live-update regNo while typing teacher name (create mode only)
    nameInput.addEventListener('input', updateRegNo);
  }

  // ===== Subject Tag Input =====
  let subjectsList = [];

  function renderSubjects() {
    const wrap = document.getElementById('subjectTagWrap');
    const input = document.getElementById('subjectInput');

    // Remove all existing tags
    wrap.querySelectorAll('.subject-tag').forEach(el => el.remove());

    // Insert tags before the input
    subjectsList.forEach((subj, idx) => {
      const tag = document.createElement('span');
      tag.className = 'subject-tag';
      tag.innerHTML = `
        ${escapeHtml(subj)}
        <button type="button" class="tag-remove" data-index="${idx}" aria-label="Remove ${escapeHtml(subj)}">
          <i class="fas fa-times"></i>
        </button>
      `;
      wrap.insertBefore(tag, input);
    });

    // Sync hidden input value (comma-separated)
    document.getElementById('subjectsHidden').value = subjectsList.join(',');
  }

  function escapeHtml(s) {
    return String(s)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;');
  }

  function addSubject(raw) {
    if (!raw) return;
    const value = raw.trim();
    if (!value) return;

    // Disallow spaces
    if (/\s/.test(value)) {
      showToast('⚠️ Spaces are not allowed in Subject. Use a single word or hyphen.');
      return;
    }

    // Duplicate check (case-insensitive)
    if (subjectsList.some(s => s.toLowerCase() === value.toLowerCase())) {
      showToast(`⚠️ Subject "${value}" is already added`);
      return;
    }

    subjectsList.push(value);
    renderSubjects();
  }

  function removeSubject(index) {
    subjectsList.splice(index, 1);
    renderSubjects();
  }

  function initSubjectTagInput() {
    const wrap = document.getElementById('subjectTagWrap');
    const input = document.getElementById('subjectInput');

    // Clicking the wrap focuses the input
    wrap.addEventListener('click', (e) => {
      if (e.target === wrap) input.focus();
    });

    // Handle tag removal via event delegation
    wrap.addEventListener('click', (e) => {
      const btn = e.target.closest('.tag-remove');
      if (btn) {
        e.preventDefault();
        e.stopPropagation();
        const idx = parseInt(btn.getAttribute('data-index'), 10);
        removeSubject(idx);
      }
    });

    // Prevent spaces from being typed at all
    input.addEventListener('keydown', (e) => {
      if (e.key === ' ') {
        e.preventDefault();
        return;
      }

      if (e.key === 'Enter' || e.key === ',') {
        e.preventDefault();
        const val = input.value.trim();
        if (val) {
          addSubject(val);
          input.value = '';
        }
        return;
      }

      // Backspace on empty input removes the last tag
      if (e.key === 'Backspace' && input.value === '' && subjectsList.length > 0) {
        subjectsList.pop();
        renderSubjects();
      }
    });

    // Also strip spaces on paste
    input.addEventListener('input', () => {
      if (/\s/.test(input.value)) {
        input.value = input.value.replace(/\s+/g, '');
      }
    });

    // Initial render
    renderSubjects();
  }

  // ===== EDIT MODE ENTRY =====
  function enterEditMode(regNo) {
    const teachers = loadTeachers();
    const teacher = teachers.find(t => t.regNo === regNo);
    if (!teacher) {
      showToast('⚠️ Teacher not found');
      return;
    }

    editingRegNo = regNo;

    // Update page header
    document.getElementById('pageTitleText').textContent = 'Edit Teacher';
    document.getElementById('pageSubtitle').textContent = 'Update teacher details (Reg No. cannot be changed)';
    document.getElementById('submitBtn').innerHTML = '<i class="fas fa-save"></i> Update Teacher';
    document.getElementById('editLockNotice').style.display = 'inline-block';

    // Lock regNo with the existing value
    const regNoInput = document.getElementById('regNo');
    regNoInput.value = teacher.regNo;
    regNoInput.readOnly = true;
    regNoInput.style.background = '#f1f5f9';
    regNoInput.style.cursor = 'not-allowed';
    regNoInput.title = 'Registration Number cannot be changed';

    // Fill personal info
    document.getElementById('teacherName').value = teacher.teacherName || '';
    document.getElementById('fatherName').value = teacher.fatherName || '';
    document.getElementById('phone').value = teacher.phoneNumber || '';
    document.getElementById('cnic').value = teacher.cnic || '';
    document.getElementById('email').value = teacher.email || '';
    document.getElementById('dob').value = teacher.dob || '';
    document.getElementById('nationality').value = teacher.nationality || '';
    document.getElementById('religion').value = teacher.religion || '';
    document.getElementById('joiningDate').value = teacher.joiningDate || '';
    document.getElementById('address').value = teacher.address || '';

    // Gender radio
    if (teacher.gender) {
      const genderRadio = document.querySelector(`input[name="gender"][value="${teacher.gender}"]`);
      if (genderRadio) genderRadio.checked = true;
    }

    // Professional info
    document.getElementById('qualification').value = teacher.qualification || '';
    document.getElementById('prevSchool').value = teacher.previousSchool || '';

    // Experience: extract numeric part only (strip "Years +" if legacy value contains it)
    const expVal = (teacher.experience || '').toString().replace(/[^\d]/g, '');
    document.getElementById('experience').value = expVal;
    // Trigger suffix visibility update
    document.getElementById('experience').dispatchEvent(new Event('input'));

    // Designation is now a text input
    document.getElementById('designation').value = teacher.designation || '';

    // Subjects (array or comma-string)
    if (Array.isArray(teacher.subjects)) {
      subjectsList = teacher.subjects.slice();
    } else if (teacher.subjectsCanTeach) {
      subjectsList = teacher.subjectsCanTeach.split(',').map(s => s.trim()).filter(Boolean);
    } else {
      subjectsList = [];
    }
    renderSubjects();

    // Photo
    if (teacher.photoUrl) {
      photoPreview.src = teacher.photoUrl;
      photoFrame.classList.add('has-image');
      fileName.textContent = 'Current photo';
    }
  }

  // ===== Form Submission (CREATE + UPDATE) =====
  function handleTeacherSubmit(e) {
    e.preventDefault();

    const teacherName = document.getElementById('teacherName').value.trim();

    if (!teacherName) {
      showToast('⚠️ Please fill all required fields (Teacher Name)');
      return;
    }

    const teachers = loadTeachers();

    // ---------- EDIT MODE ----------
    if (editingRegNo) {
      const idx = teachers.findIndex(t => t.regNo === editingRegNo);
      if (idx === -1) {
        showToast('⚠️ Teacher record not found');
        return;
      }

      const existing = teachers[idx];
      const genderInput = document.querySelector('input[name="gender"]:checked');

      // Preserve immutable fields: regNo, password. Photo preserved if not changed.
      teachers[idx] = {
        ...existing,
        teacherName: teacherName,
        fatherName: document.getElementById('fatherName').value.trim(),
        phoneNumber: document.getElementById('phone').value.trim(),
        cnic: document.getElementById('cnic').value.trim(),
        email: document.getElementById('email').value.trim(),
        gender: genderInput ? genderInput.value : '',
        dob: document.getElementById('dob').value,
        nationality: document.getElementById('nationality').value.trim(),
        religion: document.getElementById('religion').value.trim(),
        joiningDate: document.getElementById('joiningDate').value,
        address: document.getElementById('address').value.trim(),
        qualification: document.getElementById('qualification').value.trim(),
        subjects: subjectsList.slice(),
        subjectsCanTeach: subjectsList.join(', '),
        previousSchool: document.getElementById('prevSchool').value.trim(),
        experience: document.getElementById('experience').value.trim(),
        designation: document.getElementById('designation').value.trim(),
        photoUrl: document.getElementById('photoPreview').src && document.getElementById('photoPreview').src.startsWith('data:')
          ? document.getElementById('photoPreview').src
          : existing.photoUrl
        // regNo, password, status → preserved from existing
      };

      saveTeachers(teachers);
      showToast(`✅ Teacher "${teacherName}" updated successfully`);

      setTimeout(() => {
        window.location.href = 'teacher-details.html';
      }, 900);
      return;
    }

    // ---------- CREATE MODE ----------
    // Always regenerate regNo right before saving to guarantee latest sequence
    updateRegNo();

    const regNo = document.getElementById('regNo').value.trim();

    if (!regNo || regNo === 'T.MEI-') {
      showToast('⚠️ Please enter the Teacher Name to generate Reg No');
      return;
    }

    if (teachers.some(t => t.regNo.toLowerCase() === regNo.toLowerCase())) {
      showToast(`⚠️ Reg No. "${regNo}" already exists`);
      return;
    }

    const genderInput = document.querySelector('input[name="gender"]:checked');

    const newTeacher = {
      regNo: regNo,
      teacherName: teacherName,
      fatherName: document.getElementById('fatherName').value.trim(),
      phoneNumber: document.getElementById('phone').value.trim(),
      cnic: document.getElementById('cnic').value.trim(),
      email: document.getElementById('email').value.trim(),
      gender: genderInput ? genderInput.value : '',
      dob: document.getElementById('dob').value,
      nationality: document.getElementById('nationality').value.trim(),
      religion: document.getElementById('religion').value.trim(),
      joiningDate: document.getElementById('joiningDate').value,
      address: document.getElementById('address').value.trim(),
      qualification: document.getElementById('qualification').value.trim(),

      // Subject(s): store both an array and a comma-string for compatibility
      subjects: subjectsList.slice(),
      subjectsCanTeach: subjectsList.join(', '),

      previousSchool: document.getElementById('prevSchool').value.trim(),
      experience: document.getElementById('experience').value.trim(),
      designation: document.getElementById('designation').value.trim(),
      status: 'Active',
      photoUrl: document.getElementById('photoPreview').src && document.getElementById('photoPreview').src.startsWith('data:') ? document.getElementById('photoPreview').src : null,
      password: 'MESS'
    };

    teachers.push(newTeacher);
    saveTeachers(teachers);
    showToast(`✅ Teacher "${teacherName}" enrolled successfully`);
    resetForm();
  }

  const photoInput = document.getElementById('photoInput');
  const photoFrame = document.getElementById('photoFrame');
  const photoPreview = document.getElementById('photoPreview');
  const fileName = document.getElementById('fileName');

  photoFrame.addEventListener('click', () => photoInput.click());
  photoInput.addEventListener('change', e => {
    const file = e.target.files[0];
    if (file) {
      fileName.textContent = file.name;
      const reader = new FileReader();
      reader.onload = ev => {
        photoPreview.src = ev.target.result;
        photoFrame.classList.add('has-image');
      };
      reader.readAsDataURL(file);
    }
  });

  function resetForm() {
    // In edit mode, "Reset" cancels editing and goes back
    if (editingRegNo) {
      window.location.href = 'teacher-details.html';
      return;
    }

    document.getElementById('teacherForm').reset();

    // Reset Reg No with teacher prefix
    const regNoInput = document.getElementById('regNo');
    regNoInput.value = "T.MEI-";

    // Reset subjects
    subjectsList = [];
    renderSubjects();
    document.getElementById('subjectInput').value = '';

    // Hide the "Years +" suffix after reset
    document.getElementById('expSuffix').classList.remove('show');

    photoPreview.src = '';
    photoFrame.classList.remove('has-image');
    fileName.textContent = 'No file chosen';

    // Re-apply today's date after form reset
    setDefaultJoiningDate();
  }
</script>
</body>
</html>
